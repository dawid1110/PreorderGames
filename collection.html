<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preorder Hub | Moja Kolekcja</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styl dla licznika w statystykach */
        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #a855f7;
            margin-top: 8px;
        }
        .collection-date {
            font-size: 0.85rem;
            color: #a1a1aa;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- Tło -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <!-- Pasek Nawigacji Powrotu -->
        <nav class="nav-back minimal-nav" style="margin-bottom: 30px;">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Wróć do Menu
            </a>
        </nav>

        <header class="app-header">
            <h1 class="gradient-text">Twoja Kolekcja</h1>
            <p class="subtitle">Fizyczna półka z odebranymi grami.</p>
        </header>

        <!-- Układ: Siatka z paskiem bocznym -->
        <div class="list-layout">
            
            <!-- Lewa kolumna: Lista gier w kolekcji -->
            <div id="collection-container">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Ładowanie kolekcji z chmury...</p>
                </div>
            </div>

            <!-- Prawa kolumna: Panel statystyk -->
            <aside class="summary-sidebar">
                <div class="summary-card" style="animation-delay: 0.2s;">
                    <div class="summary-header">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                        <h3>Statystyki Półki</h3>
                    </div>
                    <p class="summary-subtitle">Podsumowanie zgromadzonych tytułów</p>
                    <div id="collection-stats" style="padding: 10px 0;">
                        <p style="color: #a1a1aa;">Ładowanie statystyk...</p>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <!-- Logika aplikacji -->
    <script>
        fetch('https://preorder-api-pdjz.onrender.com/get_collection')
            .then(response => {
                if (!response.ok) throw new Error('Błąd sieci');
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('collection-container');
                const statsContainer = document.getElementById('collection-stats');
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state">Twoja kolekcja jest na razie pusta. Odbierz preorder i przenieś go tutaj!</div>';
                    statsContainer.innerHTML = `
                        <div>
                            <span style="color: #a1a1aa; font-size: 0.9rem;">Wszystkie gry w kolekcji</span>
                            <div class="stat-number">0</div>
                        </div>
                    `;
                    return;
                }

                // 1. Wyświetlanie statystyk
                statsContainer.innerHTML = `
                    <div>
                        <span style="color: #a1a1aa; font-size: 0.9rem;">Wszystkie gry w kolekcji</span>
                        <div class="stat-number">${data.length}</div>
                    </div>
                `;

                // 2. Generowanie kart kolekcji
                const cardsHtml = data.map((game, index) => {
                    let encodedTitle = encodeURIComponent(game.title);
                    
                    // Ładne formatowanie daty dodania (jeśli dostępna)
                    let addedDateText = game.date_added ? game.date_added.split('T')[0] : 'Brak daty';

                    return `
                        <div class="game-card" style="animation-delay: ${index * 0.1}s; cursor: default;">
                            <div class="card-header">
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <span class="platform-badge platform-${game.platform.toLowerCase()}">${game.platform}</span>
                                    <span class="release-date">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                        Premiera: ${game.release_date}
                                    </span>
                                </div>
                                
                                <button class="btn-delete-game" onclick="deleteFromCollection(${game.id}, '${game.title}')" title="Usuń z kolekcji">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                </button>
                            </div>
                            
                            <h2 class="game-title" style="margin-top: 10px; margin-bottom: 4px;">${game.title}</h2>
                            
                            <div class="collection-date">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                Dodano do kolekcji: ${addedDateText}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `<div class="games-grid">${cardsHtml}</div>`;
            })
            .catch(error => {
                console.error('Błąd pobierania kolekcji:', error);
                document.getElementById('collection-container').innerHTML = `
                    <div class="error-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" style="margin-bottom: 16px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <h3>Nie udało się załadować kolekcji.</h3>
                        <p>Sprawdź połączenie z serwerem API.</p>
                    </div>
                `;
            });

        // ==========================================
        // Funkcja usuwania z kolekcji
        // ==========================================
        async function deleteFromCollection(id, title) {
            const isConfirmed = confirm(`Czy na pewno chcesz usunąć "${title}" ze swojej kolekcji?`);
            if (!isConfirmed) return;

            try {
                const response = await fetch('https://preorder-api-pdjz.onrender.com/delete_from_collection', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert("Nie udało się usunąć pozycji.");
                }
            } catch (error) {
                console.error("Błąd usuwania:", error);
                alert("Wystąpił problem z połączeniem z API.");
            }
        }
    </script>
</body>
</html>
