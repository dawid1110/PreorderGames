<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- PWA Meta Tagi -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#a855f7">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Preorder Hub | Logowanie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="auth-card">
        <header style="text-align: center; margin-bottom: 30px;">
            <h1 class="gradient-text" style="font-size: 2rem; margin-bottom: 8px;">Witaj ponownie</h1>
            <p style="color: #a1a1aa; font-size: 0.9rem;">Zaloguj się do swojego Preorder Huba</p>
        </header>

        <div id="error-box" class="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label>Nazwa użytkownika</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Hasło</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth">Zaloguj się</button>
        </form>

        <div class="auth-footer">
            Nie masz konta? <a href="register.html">Zarejestruj się</a>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            errorBox.style.display = 'none';

            try {
                // Wymóg OAuth2: przesyłanie formularza jako x-www-form-urlencoded
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('https://preorder-api-pdjz.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // Zapisujemy token JWT i dane użytkownika
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('username', data.username);
                    window.location.href = 'index.html';
                } else {
                    errorBox.textContent = data.detail || 'Błąd logowania.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'Problem z połączeniem z serwerem.';
                errorBox.style.display = 'block';
            }
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker zarejestrowany', reg))
                    .catch(err => console.error('Błąd rejestracji Service Workera', err));
            });
        }
    </script>
</body>
</html>
