<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preorder Hub | Dodaj Grę</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Treść formularza pozostaje bez zmian, kluczowy jest skrypt poniżej -->

    <script>
        // 1. Sprawdzenie sesji
        const userId = localStorage.getItem('user_id');
        if (!userId) {
            window.location.href = 'login.html';
        }

        // 2. Obsługa wysyłania formularza
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Zbierz dane formularza i oferty...
            const formData = {
                user_id: parseInt(userId), // Przekazujemy ID zalogowanego użytkownika
                title: document.getElementById('title').value,
                platform: document.getElementById('platform').value,
                release_date: document.getElementById('release_date').value,
                offers: gatheredOffers // Twoja tablica obiektów z ofertami sklepów
            };

            try {
                const response = await fetch('https://preorder-api-pdjz.onrender.com/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    window.location.href = 'list.html';
                } else {
                    alert("Nie udało się dodać preordera.");
                }
            } catch (error) {
                console.error("Błąd:", error);
                alert("Problem z połączeniem z API.");
            }
        });
    </script>
</body>
</html>
