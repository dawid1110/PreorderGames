<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Preorder | Ultra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="minimal-dark">

    <div class="container add-container">
        <!-- Pasek Nawigacji Powrotu -->
        <nav class="nav-back minimal-nav">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Wróć
            </a>
        </nav>

        <header class="app-header minimal-header">
            <h1>Dodaj nowy tytuł</h1>
            <p>Uzupełnij szczegóły zamówienia i śledź ceny w sklepach.</p>
        </header>

        <!-- Główna karta formularza -->
        <div class="form-card-pro">
            <form id="add-game-form">
                
                <div class="form-section-title">Dane podstawowe</div>
                
                <div class="input-group">
                    <label for="title">Tytuł Gry</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2" ry="2"></rect><circle cx="17" cy="12" r="1"></circle><circle cx="13" cy="12" r="1"></circle><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line></svg>
                        <input type="text" id="title" class="input-pro" placeholder="np. Cyberpunk 2077: Sequel" required>
                    </div>
                </div>

                <div class="form-row-pro">
                    <div class="input-group">
                        <label for="platform">Platforma</label>
                        <div class="input-wrapper">
                            <select id="platform" class="input-pro select-pro" required>
                                <option value="PS5">PlayStation 5</option>
                                <option value="NS2">Nintendo Switch 2</option>
                                <option value="PC">PC</option>
                            </select>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="release_date">Data Premiery</label>
                        <div class="input-wrapper">
                            <input type="date" id="release_date" class="input-pro" required>
                        </div>
                    </div>
                </div>

                <div class="form-divider-pro"></div>

                <div class="offers-header-pro">
                    <div class="form-section-title" style="margin: 0;">Śledzone sklepy</div>
                    <button type="button" id="btn-add-offer" class="btn-outline-pro">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Dodaj pozycję
                    </button>
                </div>
                
                <div id="offers-container" class="offers-stack">
                    <!-- Dynamiczne wiersze z ofertami generowane przez JS -->
                </div>

                <div class="form-footer-pro">
                    <div id="form-status" class="status-msg"></div>
                    <button type="submit" class="btn-solid-pro" id="btn-submit">
                        Zapisz Preorder
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        const offersContainer = document.getElementById('offers-container');
const btnAddOffer = document.getElementById('btn-add-offer');
const form = document.getElementById('add-game-form');
const statusMsg = document.getElementById('form-status');

function createOfferRow() {
    const offerDiv = document.createElement('div');
    offerDiv.className = 'offer-row-pro';
    
    offerDiv.innerHTML = `
        <div class="offer-inputs" style="grid-template-columns: 2fr 1fr 1fr 2fr;">
            <input type="text" class="input-pro store-input" placeholder="Sklep" required>
            <input type="number" step="0.01" class="input-pro price-input" placeholder="Cena PLN" required>
            <input type="number" class="input-pro order-input" placeholder="Nr Zamówienia" required>
            <input type="url" class="input-pro url-input" placeholder="Link (Wymagany URL)" required>
        </div>
        <button type="button" class="btn-delete-pro" title="Usuń">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    `;

    offerDiv.querySelector('.btn-delete-pro').addEventListener('click', () => {
        offerDiv.remove();
    });

    offersContainer.appendChild(offerDiv);
}

createOfferRow();
btnAddOffer.addEventListener('click', createOfferRow);

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const offerRows = document.querySelectorAll('.offer-row-pro');
    const offers = [];
    
    offerRows.forEach(row => {
        const store = row.querySelector('.store-input').value;
        const price = parseFloat(row.querySelector('.price-input').value);
        const orderNum = parseInt(row.querySelector('.order-input').value);
        const url = row.querySelector('.url-input').value; 
        
        offers.push({ 
            store_name: store, 
            price: price, 
            orderNumber: orderNum, 
            url: url
        });
    });

    if(offers.length === 0) {
        alert("Dodaj chociaż jedną ofertę!");
        return;
    }

    // Pobieramy datę prosto z kalendarza (jest już w dobrym formacie YYYY-MM-DD)
    const formattedDate = document.getElementById('release_date').value;

    const newGame = {
        title: document.getElementById('title').value,
        platform: document.getElementById('platform').value,
        release_date: formattedDate,
        offers: offers
    };

    const btnSubmit = document.getElementById('btn-submit');
    btnSubmit.innerHTML = 'Przetwarzanie...';
    btnSubmit.disabled = true;
    statusMsg.innerHTML = '';

    try {
        const response = await fetch('https://preorder-api-pdjz.onrender.com/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newGame)
        });

        if (response.ok) {
            statusMsg.innerHTML = '<span class="success-text">✔ Dodano pomyślnie</span>';
            form.reset();
            offersContainer.innerHTML = '';
            createOfferRow();
        } else {
            const errData = await response.json();
            console.error("Szczegóły błędu Pydantic: ", errData);
            throw new Error("Błąd walidacji");
        }
    } catch (error) {
        console.error(error);
        statusMsg.innerHTML = '<span class="error-text">✖ Odrzucone przez serwer (Sprawdź konsolę)</span>';
    } finally {
        btnSubmit.innerHTML = 'Zapisz Preorder <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
        btnSubmit.disabled = false;
    }
});
    </script>
</body>
</html>
