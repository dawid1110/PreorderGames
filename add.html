<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    <title>Preorder Hub | Dodaj Grę</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Zabezpieczenie przed wychodzeniem strony poza ekran na telefonie */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            padding: 20px 16px 60px 16px;
            margin: 0 auto;
            max-width: 900px;
        }

        .form-card {
            background: rgba(24, 24, 27, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            margin-top: 16px;
            animation: fadeIn 0.4s ease-out;
        }
        @media (min-width: 768px) {
            .container { padding-top: 40px; }
            .form-card { padding: 40px; border-radius: 20px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.02em;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #a1a1aa;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
            background: rgba(9, 9, 11, 0.95);
        }

        /* Responsywny grid dla platformy i daty */
        .two-col-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        @media (min-width: 768px) {
            .two-col-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
        }

        /* Ukrywanie nagłówków tabeli na telefonach */
        .desktop-headers {
            display: none;
        }
        @media (min-width: 951px) {
            .desktop-headers {
                display: grid;
                grid-template-columns: 1.8fr 1fr 1.5fr 2fr 44px;
                gap: 12px;
                margin-bottom: 8px;
                padding: 0 4px;
            }
        }

        /* Styl wiersza oferty */
        .offer-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            background: rgba(255, 255, 255, 0.02);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
        }
        @media (min-width: 951px) {
            .offer-row {
                grid-template-columns: 1.8fr 1fr 1.5fr 2fr 44px;
                background: transparent;
                padding: 0;
                border: none;
                margin-bottom: 14px;
            }
        }

        .offer-input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        @media (min-width: 951px) {
            .offer-input-group label { display: none; }
        }

        .offer-input {
            width: 100%;
            padding: 14px;
            background: rgba(9, 9, 11, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .offer-input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
        }
        
        .btn-add-offer {
            width: 100%;
            background: rgba(168, 85, 247, 0.08);
            color: #a855f7;
            border: 1px dashed rgba(168, 85, 247, 0.35);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            margin-top: 12px;
            margin-bottom: 32px;
        }
        .btn-add-offer:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: #a855f7;
        }
        
        .btn-remove-offer {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            margin-top: 4px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        @media (min-width: 951px) {
            .btn-remove-offer {
                width: 44px;
                height: 48px; /* Dopasowane do wysokości inputów */
                padding: 0;
                margin-top: 0;
            }
            .btn-remove-offer span { display: none; } /* Ukrywa napis "Usuń" na desktopie */
        }
        .btn-remove-offer:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: #ef4444;
        }
        
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.4);
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(168, 85, 247, 0.6);
        }
    </style>
</head>
<body>

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <nav class="nav-back minimal-nav" style="margin-bottom: 24px;">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Wróć do Menu
            </a>
        </nav>

        <header class="app-header">
            <h1 class="gradient-text">Dodaj Nowy Preorder</h1>
            <p class="subtitle" style="font-size: 0.95rem;">Wprowadź dane gry oraz oferty sklepowe.</p>
        </header>

        <div class="form-card">
            <form id="add-form">
                
                <div class="form-section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle></svg>
                    Informacje o grze
                </div>

                <div class="form-group">
                    <label>Tytuł gry</label>
                    <input type="text" id="title" required placeholder="np. Grand Theft Auto VI">
                </div>

                <div class="two-col-grid">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Platforma</label>
                        <select id="platform" required>
                            <option value="PS5">PlayStation 5</option>
                            <option value="Xbox">Xbox Series X/S</option>
                            <option value="NS2">Nintendo Switch 2 / NS</option>
                            <option value="PC">PC</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Data premiery</label>
                        <input type="text" id="release_date" required placeholder="np. 2026-11-19">
                    </div>
                </div>

                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.06); margin: 32px 0;">

                <div class="form-section-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Oferty sklepowe
                </div>

                <!-- Nagłówki widoczne TYLKO na komputerze -->
                <div class="desktop-headers">
                    <span style="font-size: 0.75rem; font-weight: 600; color: #71717a; text-transform: uppercase;">Sklep</span>
                    <span style="font-size: 0.75rem; font-weight: 600; color: #71717a; text-transform: uppercase;">Cena (zł)</span>
                    <span style="font-size: 0.75rem; font-weight: 600; color: #71717a; text-transform: uppercase;">Nr zamówienia</span>
                    <span style="font-size: 0.75rem; font-weight: 600; color: #71717a; text-transform: uppercase;">Link do oferty</span>
                    <span></span>
                </div>

                <div id="offers-container">
                    <!-- Dynamiczne wiersze ofert -->
                </div>

                <button type="button" class="btn-add-offer" onclick="addOfferRow()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Dodaj kolejny sklep
                </button>

                <button type="submit" class="btn-submit">Zapisz Preorder</button>
            </form>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('user_id');
        if (!userId) {
            window.location.href = 'login.html';
        }

        function addOfferRow() {
            const container = document.getElementById('offers-container');
            const row = document.createElement('div');
            row.className = 'offer-row';
            row.innerHTML = `
                <div class="offer-input-group">
                    <label>Sklep</label>
                    <input type="text" class="offer-store offer-input" placeholder="np. Ultima" required>
                </div>
                <div class="offer-input-group">
                    <label>Cena (zł)</label>
                    <input type="number" step="0.01" class="offer-price offer-input" placeholder="249.90" required>
                </div>
                <div class="offer-input-group">
                    <label>Nr zamówienia</label>
                    <input type="text" class="offer-order offer-input" placeholder="Opcjonalnie">
                </div>
                <div class="offer-input-group">
                    <label>Link do oferty</label>
                    <input type="url" class="offer-url offer-input" placeholder="https://...">
                </div>
                <button type="button" class="btn-remove-offer" onclick="this.closest('.offer-row').remove()" title="Usuń sklep">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    <span>Usuń ofertę</span>
                </button>
            `;
            container.appendChild(row);
        }

        addOfferRow();

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const platform = document.getElementById('platform').value;
            const release_date = document.getElementById('release_date').value.trim();

            const offerRows = document.querySelectorAll('.offer-row');
            const offers = [];

            offerRows.forEach(row => {
                const store_name = row.querySelector('.offer-store').value.trim();
                const price = parseFloat(row.querySelector('.offer-price').value);
                const order_number = row.querySelector('.offer-order').value.trim() || null;
                const url = row.querySelector('.offer-url').value.trim() || null;

                if (store_name && !isNaN(price)) {
                    offers.push({ store_name, price, order_number, url });
                }
            });

            if (offers.length === 0) {
                alert("Musisz dodać przynajmniej jedną poprawną ofertę sklepu!");
                return;
            }

            const payload = {
                user_id: parseInt(userId),
                title: title,
                platform: platform,
                release_date: release_date,
                offers: offers
            };

            try {
                const response = await fetch('https://preorder-api-pdjz.onrender.com/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    window.location.href = 'list.html';
                } else {
                    const errData = await response.json();
                    alert("Błąd podczas zapisywania: " + (errData.detail || "Nieznany błąd"));
                }
            } catch (error) {
                console.error("Błąd połączenia:", error);
                alert("Wystąpił problem z połączeniem z serwerem API.");
            }
        });
    </script>
</body>
</html>
