<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preorder Hub | Moja Lista</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-card {
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .game-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
        }
        .card-preview-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #a1a1aa;
        }
        .preview-price {
            color: #a855f7;
            font-weight: 600;
        }
        .offers-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
            opacity: 0;
        }
        .game-card.expanded .offers-wrapper {
            max-height: 500px;
            opacity: 1;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
        }
        .expand-icon {
            transition: transform 0.3s ease;
        }
        .game-card.expanded .expand-icon {
            transform: rotate(180deg);
        }
        .btn-collect-game {
            background: transparent;
            border: none;
            color: #a1a1aa;
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .btn-collect-game:hover {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }
    </style>
</head>
<body>

    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="container">
        <nav class="nav-back minimal-nav" style="margin-bottom: 30px;">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Wróć do Menu
            </a>
        </nav>

        <header class="app-header">
            <h1 class="gradient-text">Nadchodzące Premiery</h1>
            <p class="subtitle">Śledź swoje zamówienia i kontroluj wydatki.</p>
        </header>

        <div class="list-layout">
            <div id="games-container">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Ładowanie danych z chmury...</p>
                </div>
            </div>

            <aside class="summary-sidebar">
                <div class="summary-card" style="animation-delay: 0.2s;">
                    <div class="summary-header">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
                        <h3>Kosztorys</h3>
                    </div>
                    <p class="summary-subtitle">Najniższe prognozowane ceny</p>
                    <div id="monthly-summary"></div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Sprawdzenie autoryzacji
        const userId = localStorage.getItem('user_id');
        if (!userId) {
            window.location.href = 'login.html';
        }

        fetch(`https://preorder-api-pdjz.onrender.com/get_preorders?user_id=${userId}`)
            .then(response => {
                if (!response.ok) throw new Error('Błąd sieci');
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('games-container');
                const summaryContainer = document.getElementById('monthly-summary');
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state">Brak preorderów w bazie. Dodaj nową grę!</div>';
                    summaryContainer.innerHTML = '<p style="color: #a1a1aa; text-align: center;">Brak wydatków. Portfel bezpieczny!</p>';
                    return;
                }

                const monthlyCosts = {};
                let grandTotal = 0;

                data.forEach(game => {
                    if (game.offers && game.offers.length > 0) {
                        const cheapestPrice = Math.min(...game.offers.map(o => o.price));
                        
                        let year, month;
                        if (game.release_date.includes('.')) {
                            const parts = game.release_date.split('.');
                            year = parts[2]; month = parts[1];
                        } else {
                            const parts = game.release_date.split('-');
                            year = parts[0]; month = parts[1];
                        }
                        
                        const monthKey = `${year}-${month}`;

                        if (!monthlyCosts[monthKey]) {
                            const dateObj = new Date(year, parseInt(month) - 1, 1);
                            const monthLabel = dateObj.toLocaleDateString('pl-PL', { month: 'long', year: 'numeric' });
                            const capitalizedLabel = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);
                            monthlyCosts[monthKey] = { label: capitalizedLabel, total: 0 };
                        }
                        
                        monthlyCosts[monthKey].total += cheapestPrice;
                        grandTotal += cheapestPrice;
                    }
                });

                const sortedMonths = Object.keys(monthlyCosts).sort();
                const tableRows = sortedMonths.map(key => `
                    <tr>
                        <td>${monthlyCosts[key].label}</td>
                        <td class="amount">${monthlyCosts[key].total.toFixed(2)} zł</td>
                    </tr>
                `).join('');

                summaryContainer.innerHTML = `
                    <table class="summary-table">
                        <tbody>${tableRows}</tbody>
                        <tfoot>
                            <tr class="summary-total-row">
                                <td>Razem</td>
                                <td class="amount">${grandTotal.toFixed(2)} zł</td>
                            </tr>
                        </tfoot>
                    </table>
                `;

                const cardsHtml = data.map((game, index) => {
                    const cheapestPrice = game.offers && game.offers.length > 0 
                        ? Math.min(...game.offers.map(o => o.price)) 
                        : 0;

                    let offersHtml = game.offers.map(o => {
                        const orderNum = o.orderNumber || o.order_number;
                        const orderBadgeHtml = orderNum 
                            ? `<span class="order-badge" style="font-size: 0.75rem; color: #a855f7; background: rgba(168, 85, 247, 0.12); padding: 2px 8px; border-radius: 6px; margin-left: 8px; border: 1px solid rgba(168, 85, 247, 0.3); font-weight: 500;">Nr: ${orderNum}</span>` 
                            : '';

                        return `
                            <div class="offer-item">
                                <span class="store-name" style="display: flex; align-items: center; flex-wrap: wrap;">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                                    ${o.store_name || o.store}
                                    ${orderBadgeHtml}
                                </span>
                                <div class="offer-right">
                                    <span class="price">${o.price.toFixed(2)} zł</span>
                                    <a href="${o.url || '#'}" target="_blank" class="btn-store" onclick="event.stopPropagation()">Do oferty</a>
                                </div>
                            </div>
                        `;
                    }).join('');

                    let encodedTitle = encodeURIComponent(game.title);

                    return `
                        <div class="game-card" style="animation-delay: ${index * 0.1}s" onclick="toggleCard(this)">
                            <div class="card-header">
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <span class="platform-badge platform-${game.platform.toLowerCase()}">${game.platform}</span>
                                    <span class="release-date">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                        ${game.release_date}
                                    </span>
                                </div>
                                
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <button class="btn-collect-game" onclick="event.stopPropagation(); moveToCollection(decodeURIComponent('${encodedTitle}'), '${game.platform}')" title="Odbierz i przenieś do kolekcji">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    </button>
                                    <button class="btn-delete-game" onclick="event.stopPropagation(); deleteGame(decodeURIComponent('${encodedTitle}'), '${game.platform}')" title="Usuń preorder">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                    </button>
                                    <svg class="expand-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </div>
                            </div>
                            
                            <h2 class="game-title" style="margin-top: 10px; margin-bottom: 4px;">${game.title}</h2>
                            
                            <div class="card-preview-info">
                                <span>Liczba ofert: ${game.offers.length}</span>
                                <span class="preview-price">Od ${cheapestPrice.toFixed(2)} zł</span>
                            </div>

                            <div class="offers-wrapper">
                                <div class="offers-list">
                                    ${offersHtml}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `<div class="games-grid">${cardsHtml}</div>`;
            })
            .catch(error => console.error('Błąd:', error));

        function toggleCard(cardElement) {
            cardElement.classList.toggle('expanded');
        }

        async function deleteGame(title, platform) {
            if (!confirm(`Usunąć "${title}"?`)) return;
            await fetch('https://preorder-api-pdjz.onrender.com/delete', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, platform, user_id: parseInt(userId) })
            });
            window.location.reload();
        }

        async function moveToCollection(title, platform) {
            if (!confirm(`Przenieść "${title}" do kolekcji?`)) return;
            await fetch('https://preorder-api-pdjz.onrender.com/move_to_collection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, platform, user_id: parseInt(userId) })
            });
            window.location.reload();
        }
    </script>
</body>
</html>
